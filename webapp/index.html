<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>مبدل تاریخ | تولد عزیزان</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { color-scheme: light; --bg: #fbf8ef; --fg: #493b2c; --muted: #8c7b66; --card: #fffdf8; --accent: #b38a32; --accent-dark: #806018; --accentText: #49370f; --line: #e9dfc7; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: max(26px, env(safe-area-inset-top)) 18px max(28px, env(safe-area-inset-bottom)); background: radial-gradient(ellipse at 50% 0%, #f3e7c7 0, transparent 48%), var(--bg); color: var(--fg); font: 16px/1.8 system-ui, sans-serif; }
    main { max-width: 540px; margin: 0 auto; }
    .hero { text-align: center; padding: 10px 8px 20px; }
    .badge { display: inline-grid; place-items: center; width: 58px; height: 58px; border-radius: 20px; background: linear-gradient(145deg, #ead79e, #fff8e5); box-shadow: 0 7px 18px #8b6c251c; font-size: 29px; margin-bottom: 8px; }
    h1 { font-size: 1.45rem; margin: 0; letter-spacing: -.02em; }
    .hint { color: var(--muted); margin: 3px 0 0; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 5px; border: 1px solid var(--line); border-radius: 16px; background: #fffaf0; margin-bottom: 16px; box-shadow: 0 5px 18px #6c4a1b0a; }
    button, input { font: inherit; }
    .tab { border: 0; border-radius: 12px; padding: 11px 7px; color: var(--fg); background: transparent; font-size: .92rem; transition: background .18s ease, color .18s ease, transform .18s ease; }
    .tab.active { background: linear-gradient(135deg, #d6b65c, #bd9637); color: var(--accentText); box-shadow: 0 4px 12px #9e792b30; }
    .tab:active, .convert:active { transform: scale(.98); }
    .card { padding: 20px; border: 1px solid var(--line); border-radius: 20px; background: linear-gradient(145deg, #fffefa, #fffaf0); box-shadow: 0 12px 32px #6c4a1b12; }
    label { display: block; font-weight: 700; margin-bottom: 8px; }
    input { width: 100%; padding: 13px; border: 1px solid #dfd1ad; border-radius: 13px; color: var(--fg); background: #fffaf1; direction: ltr; text-align: center; outline: none; transition: border-color .18s ease, box-shadow .18s ease; }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px #c3a04425; }
    .convert { width: 100%; border: 0; border-radius: 13px; padding: 13px; margin-top: 14px; background: linear-gradient(135deg, #d6b65c, #bd9637); color: var(--accentText); font-weight: 750; box-shadow: 0 6px 14px #9e792b26; transition: transform .18s ease; }
    .result { margin-top: 18px; min-height: 30px; font-weight: 700; color: var(--accent-dark); overflow-wrap: anywhere; }
    .error { color: #df4b4b; }
    .foot { color: var(--muted); font-size: .88rem; text-align: center; margin: 17px 4px 0; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main>
    <header class="hero"><div class="badge">🗓️</div><h1>تبدیل تاریخ</h1><p class="hint">تاریخت رو وارد کن تا به تقویم دیگه ببینیش ✨</p></header>
    <div class="tabs" role="tablist" aria-label="جهت تبدیل">
      <button class="tab active" id="to-jalali" role="tab" aria-selected="true">میلادی به شمسی</button>
      <button class="tab" id="to-gregorian" role="tab" aria-selected="false">شمسی به میلادی</button>
    </div>
    <section class="card">
      <label id="date-label" for="date-input">تاریخ میلادی رو انتخاب کن</label>
      <input id="date-input" type="date" inputmode="numeric" aria-label="تاریخ">
      <button id="convert" class="convert">تبدیلش کن</button>
      <div id="result" class="result" aria-live="polite"></div>
    </section>
    <p class="foot">🔒 تاریخ همین‌جا تبدیل می‌شه و برای ربات فرستاده نمی‌شه.</p>
  </main>
  <script>
    (() => {
      const app = window.Telegram && window.Telegram.WebApp;
      if (app) { app.ready(); app.expand(); }
      const formatter = new Intl.DateTimeFormat('en-u-ca-persian-nu-latn', {
        calendar: 'persian', numberingSystem: 'latn', timeZone: 'UTC',
        year: 'numeric', month: 'numeric', day: 'numeric'
      });
      const persianDigits = new Intl.NumberFormat('fa-IR');
      const input = document.getElementById('date-input');
      const label = document.getElementById('date-label');
      const result = document.getElementById('result');
      const jalaliTab = document.getElementById('to-jalali');
      const gregorianTab = document.getElementById('to-gregorian');
      let mode = 'jalali';

      function jalaliParts(date) {
        const parts = Object.fromEntries(formatter.formatToParts(date).map(part => [part.type, part.value]));
        return [Number(parts.year), Number(parts.month), Number(parts.day)];
      }
      function compare(a, b) {
        for (let i = 0; i < 3; i++) if (a[i] !== b[i]) return a[i] < b[i] ? -1 : 1;
        return 0;
      }
      function jalaliToGregorian(value) {
        const normalized = value.trim().replace(/[۰-۹]/g, digit => String('۰۱۲۳۴۵۶۷۸۹'.indexOf(digit)))
          .replace(/[٠-٩]/g, digit => String('٠١٢٣٤٥٦٧٨٩'.indexOf(digit)));
        const match = /^(\d{4})[/-](\d{1,2})[/-](\d{1,2})$/.exec(normalized);
        if (!match) throw new Error('تاریخ شمسی رو مثل ۱۴۰۵/۰۱/۰۱ بنویس.');
        const wanted = match.slice(1).map(Number);
        const [year, month, day] = wanted;
        if (year < 1200 || month < 1 || month > 12 || day < 1 || day > 31) throw new Error('این تاریخ درست به نظر نمیاد؛ یه بار دیگه چکش کن.');
        let low = Date.UTC(year + 621, 0, 1) / 86400000;
        let high = Date.UTC(year + 623, 0, 1) / 86400000;
        while (low <= high) {
          const middle = Math.floor((low + high) / 2);
          const date = new Date(middle * 86400000);
          const order = compare(jalaliParts(date), wanted);
          if (order === 0) return date.toISOString().slice(0, 10);
          if (order < 0) low = middle + 1; else high = middle - 1;
        }
        throw new Error('این روز توی تقویم شمسی نیست.');
      }
      function convert() {
        result.className = 'result';
        try {
          if (mode === 'jalali') {
            if (!input.value) throw new Error('اول یه تاریخ میلادی انتخاب کن.');
            const date = new Date(input.value + 'T00:00:00Z');
            if (Number.isNaN(date.valueOf())) throw new Error('این تاریخ معتبر نیست؛ دوباره انتخابش کن.');
            const [year, month, day] = jalaliParts(date);
            result.textContent = '🎉 شمسیش می‌شه: ' + [year, String(month).padStart(2, '0'), String(day).padStart(2, '0')].map(Number).map(n => persianDigits.format(n)).join('/');
          } else {
            const date = jalaliToGregorian(input.value);
            result.textContent = '🎉 میلادیش می‌شه: ' + date;
          }
        } catch (error) { result.classList.add('error'); result.textContent = '⚠️ ' + error.message; }
      }
      jalaliTab.addEventListener('click', () => {
        mode = 'jalali'; input.type = 'date'; input.value = ''; input.placeholder = '';
        label.textContent = 'تاریخ میلادی رو انتخاب کن'; result.textContent = '';
        jalaliTab.classList.add('active'); jalaliTab.setAttribute('aria-selected', 'true');
        gregorianTab.classList.remove('active'); gregorianTab.setAttribute('aria-selected', 'false');
      });
      gregorianTab.addEventListener('click', () => {
        mode = 'gregorian'; input.type = 'text'; input.value = ''; input.placeholder = '۱۴۰۵/۰۱/۰۱';
        label.textContent = 'تاریخ شمسی رو بنویس (سال/ماه/روز)'; result.textContent = '';
        gregorianTab.classList.add('active'); gregorianTab.setAttribute('aria-selected', 'true');
        jalaliTab.classList.remove('active'); jalaliTab.setAttribute('aria-selected', 'false');
      });
      document.getElementById('convert').addEventListener('click', convert);
    })();
  </script>
</body>
</html>
